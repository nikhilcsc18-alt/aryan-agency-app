name: Android APK Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/download/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || vars.VITE_APP_URL }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Give Gradle permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aryan-agency-app-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK Release File
        run: |
          cp -f android/app/build/outputs/apk/debug/app-debug.apk aryan-agency-app.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aryan Agency App v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: aryan-agency-app.apk

      - name: Update version.json on main
        continue-on-error: true
        run: |
          mkdir -p public/download
          cat <<EOF > public/download/version.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "downloadUrl": "https://github.com/nikhilcsc18-alt/aryan-agency-app/releases/latest/download/aryan-agency-app.apk",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "releaseNotes": "Aryan Agency App v${{ steps.version.outputs.version }} release build."
          }
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/version.json
          if git diff --staged --quiet; then
            echo "No changes in version.json"
          else
            git commit -m "chore(distribution): update version.json to v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main || true
          fi
