name: Android APK Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/download/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Give Gradle permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aryan-agency-app-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aryan Agency App v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK and Version to public/download
        run: |
          mkdir -p public/download
          cp android/app/build/outputs/apk/debug/app-debug.apk public/download/aryan-agency-app.apk
          cat <<EOF > public/download/version.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "downloadUrl": "/download/aryan-agency-app.apk",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "releaseNotes": "Aryan Agency App v${{ steps.version.outputs.version }} release build."
          }
          EOF

      - name: Commit and Push to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/aryan-agency-app.apk public/download/version.json
          if git diff --staged --quiet; then
            echo "No changes in public/download files to commit."
          else
            git commit -m "chore(distribution): publish aryan-agency-app.apk and version.json v${{ steps.version.outputs.version }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
