name: Android APK Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/download/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || vars.VITE_APP_URL }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-35 platforms;android-34 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Give Gradle permission
        run: chmod +x android/gradlew

      - name: Ensure consistent signing keystore
        run: |
          mkdir -p ~/.android
          if [ -f android/app/release.keystore ]; then
            echo "Using committed android/app/release.keystore"
            cp -f android/app/release.keystore android/app/debug.keystore
            cp -f android/app/release.keystore ~/.android/debug.keystore
          elif [ -f android/app/debug.keystore ]; then
            echo "Using committed android/app/debug.keystore"
            cp -f android/app/debug.keystore ~/.android/debug.keystore
          elif [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding persistent keystore from secret"
            echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            cp -f android/app/release.keystore android/app/debug.keystore
            cp -f android/app/release.keystore ~/.android/debug.keystore
          else
            echo "FATAL: No consistent signing keystore found! To maintain update compatibility across releases, a consistent keystore must be provided."
            exit 1
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'aryanagency' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp -f android/app/build/outputs/apk/release/app-release.apk aryan-agency-app.apk
          else
            cp -f android/app/build/outputs/apk/debug/app-debug.apk aryan-agency-app.apk
          fi

      - name: Validate Release APK Integrity & Upgrade Compatibility
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 || '5F:80:8D:01:C9:D1:6F:17:EA:71:1D:8E:2E:6B:40:74:14:CC:69:5D:7D:F3:F8:76:38:42:D2:54:3A:0D:AC:0E' }}
        run: |
          python3 scripts/validate-release.py aryan-agency-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aryan-agency-app-v${{ steps.version.outputs.version }}
          path: aryan-agency-app.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aryan Agency App v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: aryan-agency-app.apk

      - name: Update version.json on main
        continue-on-error: true
        run: |
          mkdir -p public/download
          cat <<EOF > public/download/version.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "downloadUrl": "https://github.com/nikhilcsc18-alt/aryan-agency-app/releases/latest/download/aryan-agency-app.apk",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "releaseNotes": "Aryan Agency App v${{ steps.version.outputs.version }} release build."
          }
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/version.json
          git add -f android/app/debug.keystore || true
          if git diff --staged --quiet; then
            echo "No changes in version.json"
          else
            git commit -m "chore(distribution): update version.json to v${{ steps.version.outputs.version }} [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
